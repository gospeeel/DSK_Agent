services:
  database:
    image: postgres:15-alpine
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres_user}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres_password}
      POSTGRES_DB: ${DB_NAME:-dsk}
    ports:
      - "5432:5432"
    volumes:
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres_user} -d $${DB_NAME:-dsk}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/user_server"]
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  staff-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/staff_server"]
    ports:
      - "8081:8081"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8081
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy